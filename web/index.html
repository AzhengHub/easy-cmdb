<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f5" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg?v=linkfold-3d-2" sizes="any" />
    <script>
      try {
        const saved = localStorage.getItem('easy-cmdb-theme');
        const dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#141414' : '#f5f5f5');
      } catch {}
    </script>
    <title>Easy CMDB 资源管理</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
