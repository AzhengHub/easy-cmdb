services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: radar
      POSTGRES_DB: radar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -U, radar, -d, radar]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    build: .
    image: radar-cmdb:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      RADAR_DATABASE_URL: postgres://radar:${POSTGRES_PASSWORD}@db:5432/radar?sslmode=disable
      RADAR_ADMIN_USER: ${RADAR_ADMIN_USER:-admin}
      RADAR_ADMIN_PASSWORD: ${RADAR_ADMIN_PASSWORD:-}
      RADAR_OPERATOR_USER: ${RADAR_OPERATOR_USER:-}
      RADAR_OPERATOR_PASSWORD: ${RADAR_OPERATOR_PASSWORD:-}
      RADAR_VIEWER_USER: ${RADAR_VIEWER_USER:-}
      RADAR_VIEWER_PASSWORD: ${RADAR_VIEWER_PASSWORD:-}
      RADAR_COOKIE_SECURE: ${RADAR_COOKIE_SECURE:-false}
    ports:
      - "${RADAR_BIND:-127.0.0.1}:${RADAR_PORT:-8080}:8080"

  collector:
    image: radar-cmdb:local
    profiles: [collect]
    command: [collect]
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
      db:
        condition: service_healthy
    env_file:
      - path: ./collector-data/credentials.env
        required: false
    environment:
      RADAR_DATABASE_URL: postgres://radar:${POSTGRES_PASSWORD}@db:5432/radar?sslmode=disable
      RADAR_SOURCES_FILE: /collector/sources.json
    volumes:
      - ./collector-data:/collector:ro
      - ./collector-data/ssh:/home/radar/.ssh:ro

volumes:
  postgres-data:
