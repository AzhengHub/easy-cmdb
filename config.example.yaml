# 复制为 config.yaml 后修改；config.yaml 已被 Git 忽略。
# 以下都是默认值，不创建 config.yaml 也能直接运行。
listen: 127.0.0.1:8080
database: easy.db
web_dir: web/dist
cookie_secure: false

# 初始管理员。password 留空时使用本地默认密码 "default"。
admin:
  username: admin
  password: ""

# 可选账号，两项都留空表示不创建。
operator:
  username: ""
  password: ""

viewer:
  username: ""
  password: ""
